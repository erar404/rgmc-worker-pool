# Cloud Build pipeline — builds, tags, pushes to Artifact Registry, deploys to Cloud Run Worker Pool.
#
# Trigger on push to main branch (tag name sets the API_TAG_VERSION env var).
# Required substitutions (set in Cloud Build trigger):
#   _REGION   — Artifact Registry / Cloud Run region, e.g. us-central1
#   _AR_REPO  — Artifact Registry repository name, e.g. rgmc-docker
#   _SA       — Worker Pool service account email

steps:
  # ── 1. Build Docker image ───────────────────────────────────────────────────
  # Uses bash entrypoint so the $TAG_NAME tag is only added when non-empty
  # (TAG_NAME is empty on branch pushes; only set on git tag pushes).
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    entrypoint: bash
    args:
      - -c
      - |
        TAGS="--tag=$_AR_IMAGE:$SHORT_SHA --tag=$_AR_IMAGE:latest"
        [[ -n "$TAG_NAME" ]] && TAGS="$$TAGS --tag=$_AR_IMAGE:$TAG_NAME"
        docker build $$TAGS \
          --label=commit=$SHORT_SHA \
          --label=tag=$TAG_NAME \
          --label=build=$BUILD_ID \
          .

  # ── 2. Push all tags to Artifact Registry ──────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args:
      - push
      - '--all-tags'
      - '$_AR_IMAGE'
    waitFor: ['build']

  # ── 3. Deploy to Cloud Run Worker Pool ────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: gcloud
    args:
      - beta
      - run
      - worker-pools
      - deploy
      - '$_WORKER_POOL'
      - '--image=$_AR_IMAGE:$SHORT_SHA'
      - '--region=$_REGION'
      - '--service-account=$_SA'
      - '--update-env-vars=API_TAG_VERSION=$TAG_NAME'
      - '--project=$PROJECT_ID'
    waitFor: ['push']

# Only report the always-valid tags — $TAG_NAME is omitted here because it is
# empty on branch pushes and would make Cloud Build reject the build before it starts.
images:
  - '$_AR_IMAGE:$SHORT_SHA'
  - '$_AR_IMAGE:latest'

substitutions:
  _REGION: us-central1
  _AR_REPO: rgmc-docker
  _AR_IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/rgmc-worker-pool
  _SA: rgmc-worker-pool@${PROJECT_ID}.iam.gserviceaccount.com
  _WORKER_POOL: rgmc-worker-pool

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE
